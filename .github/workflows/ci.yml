name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Installs the Go and Node versions pinned in .mise.toml.
      - uses: jdx/mise-action@v2

      - name: vet
        run: go vet ./...

      - name: js syntax
        run: mise run lint:js

      - name: test
        run: go test ./...

      - name: build
        run: CGO_ENABLED=0 go build -o /dev/null ./cmd/benreadin
